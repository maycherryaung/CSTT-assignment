<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataBox.ai — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
    }

    /* Brand header */
    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #fff;
      margin-bottom: 0.75rem;
      box-shadow: 0 8px 24px rgba(99,102,241,0.4);
    }
    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .brand-subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    /* Card */
    .login-card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .login-card h5 {
      color: #f1f5f9;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    /* Form controls */
    .form-label {
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }
    .input-group-text {
      background: #0f172a;
      border: 1px solid #334155;
      color: #64748b;
    }
    .form-control {
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      border-radius: 0 8px 8px 0;
      padding: 0.6rem 0.85rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      background: #0f172a;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
      color: #e2e8f0;
    }
    .form-control::placeholder { color: #475569; }
    .input-group > .input-group-text { border-radius: 8px 0 0 8px; }

    /* Submit button */
    .btn-signin {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.65rem;
      width: 100%;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.02em;
    }
    .btn-signin:hover  { opacity: 0.9; transform: translateY(-1px); color: #fff; }
    .btn-signin:active { transform: translateY(0); }

    /* Error alert */
    .alert-danger {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: 8px;
      font-size: 0.85rem;
      padding: 0.65rem 0.9rem;
    }

    /* Footer note */
    .login-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #475569;
    }
    .login-footer i { margin-right: 0.25rem; }
  </style>
</head>
<body>

  <div class="login-wrapper">

    <div class="brand-header">
      <div class="brand-logo"><i class="bi bi-bar-chart-fill"></i></div>
      <h1 class="brand-title">DataBox.ai</h1>
      <p class="brand-subtitle">Analytics Portal</p>
    </div>

    <div class="login-card">
      <h5>Sign in to your account</h5>

      {% if error %}
      <div class="alert alert-danger mb-3" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="Enter username" autocomplete="username" required>
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Enter password" autocomplete="current-password" required>
          </div>
        </div>
        <button type="submit" class="btn-signin">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>
    </div>

    <p class="login-footer">
      <i class="bi bi-shield-lock"></i>Internal staff access — private subnet only
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmMPOpuRMjHNb6Q1qvIqGBMYMFqi"
          crossorigin="anonymous"></script>
</body>
</html>
