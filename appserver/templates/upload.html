<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataBox.ai — Upload CSV</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">DataBox.ai Analytics Portal</span>
      <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-8 col-lg-6">

        <div class="card shadow-sm">
          <div class="card-header bg-dark text-white py-3">
            <h5 class="mb-0">Upload CSV Dataset</h5>
          </div>
          <div class="card-body p-4">

            {% if error %}
            <div class="alert alert-danger" role="alert">
              {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/upload" enctype="multipart/form-data" novalidate>
              <div class="mb-3">
                <label for="file" class="form-label">Select CSV File</label>
                <input
                  type="file"
                  class="form-control"
                  id="file"
                  name="file"
                  accept=".csv"
                  required>
                <div class="form-text text-muted">
                  Only <strong>.csv</strong> files are accepted. Maximum file size: <strong>16 MB</strong>.
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Upload &amp; Process</button>
              </div>
            </form>

          </div>
        </div>

        <div class="mt-3 text-center">
          <a href="/dashboard" class="text-decoration-none text-secondary small">View Dashboard</a>
        </div>

      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmMPOpuRMjHNb6Q1qvIqGBMYMFqi"
    crossorigin="anonymous">
  </script>
</body>
</html>
