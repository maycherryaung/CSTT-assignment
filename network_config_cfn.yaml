AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DataBox.ai - Core Networking Stack (VPC, Subnets, NACLs, Security Groups,
  Route Tables, IGW, NAT Gateway) — CSTT AWS Cloud Security Assignment.
  Covers the CSTT VPC (10.0.0.0/16) only. Does not touch the default AWS VPC.

Resources:

  # ── VPC ──────────────────────────────────────────────────────────────────
  EC2VPC:
    Type: "AWS::EC2::VPC"
    Properties:
      CidrBlock: "10.0.0.0/16"
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: "default"
      Tags:
        - Key: "Name"
          Value: "csttassg"

  # ── Internet Gateway ──────────────────────────────────────────────────────
  EC2InternetGateway:
    Type: "AWS::EC2::InternetGateway"
    Properties:
      Tags:
        - Key: "Name"
          Value: "cstt-assg-ig"

  EC2VPCGatewayAttachmentIGW:
    Type: "AWS::EC2::VPCGatewayAttachment"
    Properties:
      VpcId: !Ref EC2VPC
      InternetGatewayId: !Ref EC2InternetGateway

  # ── Elastic IP for NAT Gateway ────────────────────────────────────────────
  EC2EIPNatGateway:
    Type: "AWS::EC2::EIP"
    DependsOn: EC2VPCGatewayAttachmentIGW
    Properties:
      Domain: "vpc"
      Tags:
        - Key: "Name"
          Value: "cstt-nat-eip"

  # ── NAT Gateway (placed in Public Subnet A) ───────────────────────────────
  # Allows private subnets to initiate outbound internet traffic (e.g. apt-get)
  # without being directly reachable from the internet.
  EC2NatGateway:
    Type: "AWS::EC2::NatGateway"
    DependsOn: EC2VPCGatewayAttachmentIGW
    Properties:
      ConnectivityType: "public"
      SubnetId: !Ref EC2SubnetPublicA
      AllocationId: !GetAtt EC2EIPNatGateway.AllocationId
      Tags:
        - Key: "Name"
          Value: "appservnatgate"

  # ── Subnets ───────────────────────────────────────────────────────────────
  EC2SubnetPublicA:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref EC2VPC
      CidrBlock: "10.0.1.0/24"
      AvailabilityZone: "us-east-1a"
      MapPublicIpOnLaunch: true
      EnableDns64: false
      Ipv6Native: false
      PrivateDnsNameOptionsOnLaunch:
        HostnameType: "ip-name"
        EnableResourceNameDnsARecord: false
        EnableResourceNameDnsAAAARecord: false
      Tags:
        - Key: "Name"
          Value: "cstt-public-subnet-a"

  EC2SubnetPublicB:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref EC2VPC
      CidrBlock: "10.0.2.0/24"
      AvailabilityZone: "us-east-1b"
      MapPublicIpOnLaunch: true
      EnableDns64: false
      Ipv6Native: false
      PrivateDnsNameOptionsOnLaunch:
        HostnameType: "ip-name"
        EnableResourceNameDnsARecord: false
        EnableResourceNameDnsAAAARecord: false
      Tags:
        - Key: "Name"
          Value: "cstt-public-subnet-b"

  EC2SubnetPrivateA:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref EC2VPC
      CidrBlock: "10.0.3.0/24"
      AvailabilityZone: "us-east-1a"
      MapPublicIpOnLaunch: false
      EnableDns64: false
      Ipv6Native: false
      PrivateDnsNameOptionsOnLaunch:
        HostnameType: "ip-name"
        EnableResourceNameDnsARecord: false
        EnableResourceNameDnsAAAARecord: false
      Tags:
        - Key: "Name"
          Value: "cstt-private-subnet-a"

  EC2SubnetPrivateB:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref EC2VPC
      CidrBlock: "10.0.4.0/24"
      AvailabilityZone: "us-east-1b"
      MapPublicIpOnLaunch: false
      EnableDns64: false
      Ipv6Native: false
      PrivateDnsNameOptionsOnLaunch:
        HostnameType: "ip-name"
        EnableResourceNameDnsARecord: false
        EnableResourceNameDnsAAAARecord: false
      Tags:
        - Key: "Name"
          Value: "cstt-private-subnet-b"

  # ── Route Tables ──────────────────────────────────────────────────────────
  EC2RouteTablePublic:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref EC2VPC
      Tags:
        - Key: "Name"
          Value: "public-rt"

  EC2RouteTablePrivate:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref EC2VPC
      Tags:
        - Key: "Name"
          Value: "private-rt"

  # Public default route → Internet Gateway
  EC2RoutePublicDefault:
    Type: "AWS::EC2::Route"
    DependsOn: EC2VPCGatewayAttachmentIGW
    Properties:
      RouteTableId: !Ref EC2RouteTablePublic
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref EC2InternetGateway

  # Private default route → NAT Gateway (outbound internet for App Server)
  EC2RoutePrivateDefault:
    Type: "AWS::EC2::Route"
    DependsOn: EC2NatGateway
    Properties:
      RouteTableId: !Ref EC2RouteTablePrivate
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref EC2NatGateway

  # ── Route Table Associations ──────────────────────────────────────────────
  EC2SubnetRouteTableAssociationPublicA:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      SubnetId: !Ref EC2SubnetPublicA
      RouteTableId: !Ref EC2RouteTablePublic

  EC2SubnetRouteTableAssociationPublicB:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      SubnetId: !Ref EC2SubnetPublicB
      RouteTableId: !Ref EC2RouteTablePublic

  EC2SubnetRouteTableAssociationPrivateA:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      SubnetId: !Ref EC2SubnetPrivateA
      RouteTableId: !Ref EC2RouteTablePrivate

  EC2SubnetRouteTableAssociationPrivateB:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      SubnetId: !Ref EC2SubnetPrivateB
      RouteTableId: !Ref EC2RouteTablePrivate

  # ── Network ACLs ──────────────────────────────────────────────────────────
  EC2NetworkAclPublic:
    Type: "AWS::EC2::NetworkAcl"
    Properties:
      VpcId: !Ref EC2VPC
      Tags:
        - Key: "Name"
          Value: "cstt-public-acl"

  EC2NetworkAclPrivate:
    Type: "AWS::EC2::NetworkAcl"
    Properties:
      VpcId: !Ref EC2VPC
      Tags:
        - Key: "Name"
          Value: "cstt-private-acl"

  # Public NACL — Inbound
  PublicNACLInboundSSH:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPublic
      RuleNumber: 100
      Protocol: 6
      RuleAction: "allow"
      Egress: false
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 22
        To: 22

  PublicNACLInboundHTTPS:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPublic
      RuleNumber: 110
      Protocol: 6
      RuleAction: "allow"
      Egress: false
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 443
        To: 443

  PublicNACLInboundHTTP:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPublic
      RuleNumber: 120
      Protocol: 6
      RuleAction: "allow"
      Egress: false
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 80
        To: 80

  PublicNACLInboundEphemeral:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPublic
      RuleNumber: 900
      Protocol: 6
      RuleAction: "allow"
      Egress: false
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 1024
        To: 65535

  # Public NACL — Outbound
  PublicNACLOutboundSSH:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPublic
      RuleNumber: 100
      Protocol: 6
      RuleAction: "allow"
      Egress: true
      CidrBlock: "10.0.0.0/16"
      PortRange:
        From: 22
        To: 22

  PublicNACLOutboundEphemeral:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPublic
      RuleNumber: 110
      Protocol: 6
      RuleAction: "allow"
      Egress: true
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 1024
        To: 65535

  # Private NACL — Inbound
  PrivateNACLInboundSSH:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPrivate
      RuleNumber: 100
      Protocol: 6
      RuleAction: "allow"
      Egress: false
      CidrBlock: "10.0.1.0/24"
      PortRange:
        From: 22
        To: 22

  PrivateNACLInboundHTTP:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPrivate
      RuleNumber: 110
      Protocol: 6
      RuleAction: "allow"
      Egress: false
      CidrBlock: "10.0.1.0/24"
      PortRange:
        From: 80
        To: 80

  PrivateNACLInboundEphemeral:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPrivate
      RuleNumber: 120
      Protocol: 6
      RuleAction: "allow"
      Egress: false
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 1024
        To: 65535

  # Private NACL — Outbound
  PrivateNACLOutboundHTTPS:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPrivate
      RuleNumber: 100
      Protocol: 6
      RuleAction: "allow"
      Egress: true
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 443
        To: 443

  PrivateNACLOutboundHTTP:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPrivate
      RuleNumber: 110
      Protocol: 6
      RuleAction: "allow"
      Egress: true
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 80
        To: 80

  PrivateNACLOutboundEphemeral:
    Type: "AWS::EC2::NetworkAclEntry"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPrivate
      RuleNumber: 120
      Protocol: 6
      RuleAction: "allow"
      Egress: true
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 1024
        To: 65535

  # ── NACL Associations ─────────────────────────────────────────────────────
  EC2SubnetNACLAssocPublicA:
    Type: "AWS::EC2::SubnetNetworkAclAssociation"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPublic
      SubnetId: !Ref EC2SubnetPublicA

  EC2SubnetNACLAssocPublicB:
    Type: "AWS::EC2::SubnetNetworkAclAssociation"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPublic
      SubnetId: !Ref EC2SubnetPublicB

  EC2SubnetNACLAssocPrivateA:
    Type: "AWS::EC2::SubnetNetworkAclAssociation"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPrivate
      SubnetId: !Ref EC2SubnetPrivateA

  EC2SubnetNACLAssocPrivateB:
    Type: "AWS::EC2::SubnetNetworkAclAssociation"
    Properties:
      NetworkAclId: !Ref EC2NetworkAclPrivate
      SubnetId: !Ref EC2SubnetPrivateB

  # ── Security Groups ───────────────────────────────────────────────────────
  EC2SecurityGroupBastion:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupName: "bastionhostsg"
      GroupDescription: "SSH access to Bastion Host from allowed IP only"
      VpcId: !Ref EC2VPC
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: "195.133.135.250/32"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: "0.0.0.0/0"

  EC2SecurityGroupAppServer:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupName: "appserversg"
      GroupDescription: "SSH and web traffic from Bastion Host only"
      VpcId: !Ref EC2VPC
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref EC2SecurityGroupBastion
        - IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref EC2SecurityGroupBastion
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: "0.0.0.0/0"

# ── Outputs ───────────────────────────────────────────────────────────────────
Outputs:
  VPCId:
    Value: !Ref EC2VPC
    Description: "CSTT VPC ID"
    Export:
      Name: !Sub "${AWS::StackName}-VPCId"

  PublicSubnetA:
    Value: !Ref EC2SubnetPublicA
    Description: "Public Subnet A (10.0.1.0/24) — Bastion Host"
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetA"

  PublicSubnetB:
    Value: !Ref EC2SubnetPublicB
    Description: "Public Subnet B (10.0.2.0/24)"
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetB"

  PrivateSubnetA:
    Value: !Ref EC2SubnetPrivateA
    Description: "Private Subnet A (10.0.3.0/24) — App Server"
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetA"

  PrivateSubnetB:
    Value: !Ref EC2SubnetPrivateB
    Description: "Private Subnet B (10.0.4.0/24)"
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetB"

  NatGatewayId:
    Value: !Ref EC2NatGateway
    Description: "NAT Gateway ID (appservnatgate)"
    Export:
      Name: !Sub "${AWS::StackName}-NatGatewayId"

  NatGatewayEIP:
    Value: !Ref EC2EIPNatGateway
    Description: "Elastic IP address of the NAT Gateway"
    Export:
      Name: !Sub "${AWS::StackName}-NatGatewayEIP"

  BastionSGId:
    Value: !Ref EC2SecurityGroupBastion
    Description: "Bastion Host Security Group ID"
    Export:
      Name: !Sub "${AWS::StackName}-BastionSGId"

  AppServerSGId:
    Value: !Ref EC2SecurityGroupAppServer
    Description: "App Server Security Group ID"
    Export:
      Name: !Sub "${AWS::StackName}-AppServerSGId"
